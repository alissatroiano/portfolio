{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid px-sm-4 px-md-5 mt-5 pt-5">
    <div class="row d-flex my-0 mx-auto pt-3">
        <div class="col-12 text-start pt-3">
            <h2 class="display-5 text-start folio-index">Portfolio</h2>
        </div>
        </div>
        <div class="row d-flex justify-content-end">
              <div class="col-6 text-end order-2">
                <form method="get" class="d-flex justify-content-end align-items-end">
                    <div class="dropdown me-3" id="technologiesDropdown">
                        <button class="technologies-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <div class="stack-icon">
                                <div class="my-0 mx-auto text-center ps-3 py-1">
                                <i class="text-purple fas fa-wrench fa-lg"></i>
                                </div>
                                <p class="text-center text-mark-projects ps-3">Sort By </p>
                    
                            </div>   
                        </button>
                        <div class="dropdown-menu p-3" style="min-width: 400px; max-width: 700px;" id="technologiesDropdown">
                            <div class="row">
                                {% for tech in technologies %}
                                <div class="col-6 col-sm-4 mb-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="technology" value="{{ tech.id }}" 
                                               id="tech{{ tech.id }}" {% if tech.id|stringformat:'s' in selected_technologies %}checked{% endif %}
                                               onchange="this.form.submit()">
                                        <label class="form-check-label small my-1" for="tech{{ tech.id }}">
                                            {{ tech.name }}
                                        </label>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                            <hr class="my-1 divider-dropdown">
                            <div class="text-end">
                                <a href="{% url 'project_index' %}" class="clear-btn">Clear</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-6 text-end order-1">
                <form method="get" class="d-flex justify-content-start align-items-start">
                    <div class="dropdown" id="categoriesDropdown">
                        <button class="technologies-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <div class="stack-icon">
                                <div class="my-0 mx-auto text-center ps-3 py-1">
                                    <i class="text-purple fas fa-folder fa-lg"></i>
                                </div>
                                <p class="text-center text-mark-projects ps-3">Category</p>
                            </div>
                        </button>
                        <div class="dropdown-menu p-3" style="min-width: 200px;">
                            {% for category in categories %}
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="category" value="{{ category.id }}" 
                                       id="cat{{ category.id }}" {% if selected_category == category.id|stringformat:'s' %}checked{% endif %}
                                       onchange="this.form.submit()">
                                <label class="form-check-label small" for="cat{{ category.id }}">
                                    {{ category.name }}
                                </label>
                            </div>
                            {% endfor %}
                            <hr class="my-2">
                            <div class="text-center">
                                <a href="{% url 'project_index' %}" class="clear-btn">Clear</a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            </div>
        </div>
  
        <!-- Filter Controls -->
        <div class="row mb-4 d-flex justify-content-start">
      
        </div>
    </div>
<div class="row g-4 my-0 mx-auto pb-3" data-masonry='{"percentPosition": true }'>
{% for project in projects %}
<div class="col-xs-8 col-sm-4">
    <div class="card rounded-5 img-fluid" id="project-card">
        <img src="/media/{{ project.picture }}" class="card-img project-pic" alt="project.title">
        <a href="{% url 'project_detail' project.id %}" class="stretched-link"></a>
    </div>
</div>
{% endfor %}
</div>

<!-- Back to Top Button -->
<button id="backToTop" class="btn back-to-top position-fixed" style="bottom: 20px; right: 20px; z-index: 1000; display: none;" id="backToTopBtn">
    <i class="fas fa-chevron-up"></i>
</button>

</div>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
// Back to top button functionality
window.addEventListener('scroll', function() {
    const backToTopBtn = document.getElementById('backToTop');
    if (window.pageYOffset > 300) {
        backToTopBtn.style.display = 'block';
    } else {
        backToTopBtn.style.display = 'none';
    }
});

document.getElementById('backToTop').addEventListener('click', function() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
});
</script>
{% endblock %}
