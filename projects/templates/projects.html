{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid">
    <div class="row text-center pt-5">
        <div class="col-12">
            <h2 class="ms-2 ms-sm-3 section-title display-5 mt-5 pt-5 text-center text-sm-start">My Projects</h2>
        </div>
        <div class="my-0 ms-sm-3 justify-content-center text-center py-2">
            <hr>
        </div>
    </div>
<div class="row g-4 my-0 mx-auto" data-masonry='{"percentPosition": true }'>
{% for project in projects %}
<div class="col-xs-8 col-sm-4">
    <div class="card h-100 rounded-5 img-fluid shadow-lg" id="project-card">
        <img src="/media/{{ project.picture }}" class="card-img project-pic" alt="project.title">
        <a href="{% url 'project_detail' project.id %}" class="stretched-link"></a>
    </div>
</div>
{% endfor %}
</div>
</div>
{% endblock %}
